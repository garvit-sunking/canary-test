apiVersion: v1
kind: Namespace
metadata: {name: demo, labels: {istio-injection: enabled}}
---
apiVersion: v1
kind: Service
metadata: {name: nginx, namespace: demo}
spec: {selector: {app: nginx}, ports: [{name: http, port: 80, targetPort: 80}]}
---
apiVersion: v1
kind: Service
metadata: {name: nginx-canary, namespace: demo}
spec: {selector: {app: nginx}, ports: [{name: http, port: 80, targetPort: 80}]}
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata: {name: nginx, namespace: demo}
spec:
  replicas: 2
  selector: {matchLabels: {app: nginx}}
  strategy:
    canary:
      stableService: nginx
      canaryService: nginx-canary
      dynamicStableScale: true       # scale stable down as canary weight goes up
      trafficRouting:
        istio:                       # internal (pod -> svc)
          virtualService: {name: nginx, routes: [primary]}
        nginx:                       # external (ingress)
          stableIngress: nginx
          additionalIngressAnnotations:
            canary-by-header: X-Canary
            canary-by-header-value: "true"
      steps:
      - setWeight: 10
      - pause: {}
      - setWeight: 25
      - pause: {}
      - setWeight: 50
      - pause: {}
      - setWeight: 75
      - pause: {}
  template:
    metadata: {labels: {app: nginx}}
    spec:
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        env: [{name: VERSION, value: v2}]      # change to v2 to start a canary
        command: ["sh", "-c", "echo $VERSION > /usr/share/nginx/html/index.html && exec nginx -g 'daemon off;'"]
        ports: [{containerPort: 80}]
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata: {name: nginx, namespace: demo}
spec:
  hosts: [nginx]
  http:
  - name: canary-header
    match: [{headers: {x-canary: {exact: "true"}}}]
    route: [{destination: {host: nginx-canary, port: {number: 80}}}]
  - name: primary
    route:
    - {destination: {host: nginx, port: {number: 80}}, weight: 100}
    - {destination: {host: nginx-canary, port: {number: 80}}, weight: 0}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: nginx, namespace: demo}
spec:
  ingressClassName: nginx
  rules:
  - host: demo.local
    http:
      paths:
      - {path: /, pathType: Prefix, backend: {service: {name: nginx, port: {number: 80}}}}
---
# in-mesh client for testing internal traffic
apiVersion: v1
kind: Namespace
metadata: {name: client, labels: {istio-injection: enabled}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: curl, namespace: client}
spec:
  selector: {matchLabels: {app: curl}}
  template:
    metadata: {labels: {app: curl}}
    spec:
      containers:
      - {name: curl, image: curlimages/curl:8.10.1, command: ["sleep", "infinity"]}
